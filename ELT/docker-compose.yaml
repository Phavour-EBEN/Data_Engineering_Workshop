version: '3'

services:
  source_postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: source_db
    ports:
      - "5433:5432"
    networks:
      - elt_network
    volumes:
      - ./source_db_init/init.sql:/docker-entrypoint-initdb.d/init.sql
  
  destination_postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: destination_db
    ports:
      - "5434:5432"
    networks:
      - elt_network
  elt_script:
    build: .
    command: [ "python", "elt_script.py" ]
    depends_on:
      - source_postgres
      - destination_postgres
    networks:
      - elt_network


networks:
  elt_network:
    driver: bridge
  